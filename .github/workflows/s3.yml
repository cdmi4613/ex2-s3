# 워크플로우 이름
name: GitOps CI Pipeline

# main 브랜치에 push되면 실행
on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      # GitHub Repository 코드 가져오기
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      # AWS 자격 증명 설정
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # S3 정적 웹사이트로 배포
      - name: S3 정적웹사이트로 배포
        run: |
          aws s3 sync . s3://std01-static-web-0914/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"